<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="client-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="server-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="proc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1100" height="800" rx="20" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1097" height="797" rx="19" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(550, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle">Comunicación Síncrona HTTP y Ciclo de Round-Trip</text>
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Flujo secuencial de petición, procesamiento y espera en el protocolo HTTP</text>
  </g>

  <!-- Actors Header -->
  <g transform="translate(130, 105)" filter="url(#shadow)">
    <rect width="240" height="56" rx="12" fill="url(#client-card)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">💻 CLIENTE (Browser / App)</text>
    <text x="120" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">Inicia la petición y espera respuesta</text>
  </g>

  <g transform="translate(730, 105)" filter="url(#shadow)">
    <rect width="240" height="56" rx="12" fill="url(#server-card)" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🖥️ SERVIDOR WEB (Backend)</text>
    <text x="120" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Procesa la lógica y devuelve datos</text>
  </g>

  <!-- Lifelines -->
  <line x1="250" y1="165" x2="250" y2="670" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="850" y1="165" x2="850" y2="670" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Client Waiting / Blocking Bar -->
  <g transform="translate(242, 210)">
    <rect width="16" height="380" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  </g>

  <!-- Round-Trip Bracket on Left -->
  <g transform="translate(80, 210)">
    <path d="M 140 0 L 110 0 L 110 190 L 80 190 L 110 190 L 110 380 L 140 380" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-10" y="165" width="115" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="47.5" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">⌛️ RTT TOTAL</text>
    <text x="47.5" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Tiempo de Espera</text>
  </g>

  <!-- Step 1: Request Arrow -->
  <g transform="translate(0, 210)">
    <!-- Diagonal Request Line from (258, 0) to (842, 110) -->
    <line x1="258" y1="0" x2="842" y2="110" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-req)"/>
    
    <g transform="translate(550, 40)" filter="url(#shadow)">
      <rect x="-190" y="-18" width="380" height="42" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">1. Envío del Request <tspan font-weight="normal" fill="#475569">(HTTP / TCP-IP)</tspan></text>
      <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Viaje de ida por la red • Depende de distancia y saltos de routers</text>
    </g>
  </g>

  <!-- Step 2: Processing in Server -->
  <g transform="translate(835, 320)">
    <rect width="30" height="160" rx="6" fill="url(#proc-grad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Explanation Box for Processing -->
    <g transform="translate(-30, 18)" filter="url(#shadow)">
      <rect x="-270" y="0" width="280" height="124" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="-130" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">⚙️ 2. Tiempo de Procesamiento</text>
      <text x="-250" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#1e293b">• Ejecución lógica de negocio</text>
      <text x="-250" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#1e293b">• Consultas a Base de Datos (JPA)</text>
      <text x="-250" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#1e293b">• Llamadas a APIs o Microservicios</text>
      <text x="-250" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• El cliente permanece bloqueado</text>
    </g>
  </g>

  <!-- Step 3: Response Arrow -->
  <g transform="translate(0, 480)">
    <!-- Diagonal Response Line from (842, 0) to (258, 110) -->
    <line x1="842" y1="0" x2="258" y2="110" stroke="#059669" stroke-width="3" marker-end="url(#arrow-res)"/>
    
    <g transform="translate(550, 40)" filter="url(#shadow)">
      <rect x="-190" y="-18" width="380" height="42" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">3. Envío del Response <tspan font-weight="normal" fill="#475569">(Status Code + Body)</tspan></text>
      <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Viaje de vuelta por la red con los datos hacia el cliente</text>
    </g>
  </g>

  <!-- Total Time Formula Footer Banner -->
  <g transform="translate(130, 680)" filter="url(#shadow)">
    <rect width="840" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="420" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">⏱️ FÓRMULA DEL TIEMPO TOTAL DE ESPERA (ROUND-TRIP)</text>
    <text x="420" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#334155" text-anchor="middle">
      <tspan font-weight="bold" fill="#0284c7">Tiempo Ida (Request)</tspan> + 
      <tspan font-weight="bold" fill="#b45309"> Tiempo Servidor (CPU/BD)</tspan> + 
      <tspan font-weight="bold" fill="#047857"> Tiempo Vuelta (Response)</tspan>
    </text>
  </g>
</svg>