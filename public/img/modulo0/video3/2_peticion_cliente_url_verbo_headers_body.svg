<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1100" height="860" rx="20" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1097" height="857" rx="19" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(550, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle">Estructura de una Petición HTTP (Request)</text>
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Anatomía de los 4 componentes fundamentales enviados por el cliente</text>
  </g>

  <!-- Container Box -->
  <g transform="translate(70, 95)" filter="url(#shadow)">
    <rect width="960" height="720" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- BLOCK 1 & 2: Start Line (Method + URL) -->
    <g transform="translate(25, 25)">
      <rect width="910" height="185" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      
      <!-- Method Badge -->
      <g transform="translate(20, 20)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">1. VERBO / MÉTODO HTTP</text>
        <g transform="translate(0, 12)">
          <rect x="0" y="0" width="65" height="28" rx="6" fill="#2563eb"/>
          <text x="32.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">POST</text>

          <rect x="75" y="0" width="55" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
          <text x="102.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">GET</text>

          <rect x="140" y="0" width="55" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
          <text x="167.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">PUT</text>

          <rect x="205" y="0" width="65" height="28" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
          <text x="237.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="middle">DELETE</text>

          <rect x="280" y="0" width="65" height="28" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
          <text x="312.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PATCH</text>
        </g>
      </g>

      <!-- URL Breakdown -->
      <g transform="translate(20, 85)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">2. URL / ENDPOINT DEL RECURSO</text>
        
        <!-- URL Display Bar -->
        <rect x="0" y="12" width="870" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="15" y="36" font-family="'Courier New', Courier, monospace" font-size="14" fill="#0f172a">
          <tspan fill="#64748b">https://</tspan><tspan fill="#1d4ed8" font-weight="bold">localhost:8080</tspan><tspan fill="#047857" font-weight="bold">/api/v1/products/42</tspan><tspan fill="#b45309" font-weight="bold">?category=electronics&amp;sort=asc</tspan>
        </text>

        <!-- Sublabels for URL parts -->
        <g transform="translate(15, 62)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">Protocolo</text>
          <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="700">Host + Puerto</text>
          <text x="300" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#047857" font-weight="700">Path (Recurso / ID)</text>
          <text x="560" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#b45309" font-weight="700">Query Parameters (Filtros)</text>
        </g>
      </g>
    </g>

    <!-- BLOCK 3: Headers -->
    <g transform="translate(25, 230)">
      <rect width="910" height="195" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <g transform="translate(20, 20)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7c3aed">3. HEADERS (Metadatos de la Petición)</text>
        <text x="290" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Cabeceras de contexto, negociación de formatos y seguridad</text>

        <rect x="0" y="12" width="870" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        
        <g transform="translate(15, 34)" font-family="'Courier New', Courier, monospace" font-size="13">
          <text x="0" y="0"><tspan fill="#1e40af" font-weight="bold">Host:</tspan> <tspan fill="#0f172a">api.empresa.com:8080</tspan></text>
          <text x="0" y="22"><tspan fill="#1e40af" font-weight="bold">Content-Type:</tspan> <tspan fill="#0f172a">application/json</tspan> <tspan fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">← Formato del cuerpo que envía el cliente</tspan></text>
          <text x="0" y="44"><tspan fill="#1e40af" font-weight="bold">Accept:</tspan> <tspan fill="#0f172a">application/json</tspan> <tspan fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">← Formato que el cliente espera recibir en la respuesta</tspan></text>
          <text x="0" y="66"><tspan fill="#1e40af" font-weight="bold">Authorization:</tspan> <tspan fill="#b45309" font-weight="bold">Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</tspan> <tspan fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">← Token JWT de seguridad</tspan></text>
          <text x="0" y="88"><tspan fill="#1e40af" font-weight="bold">User-Agent:</tspan> <tspan fill="#475569">Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)...</tspan></text>
        </g>
      </g>
    </g>

    <!-- BLOCK 4: Body / Payload -->
    <g transform="translate(25, 445)">
      <rect width="910" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <g transform="translate(20, 20)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#059669">4. BODY / PAYLOAD (Cuerpo de Datos)</text>
        <text x="310" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Información que se transmite al servidor (JSON, XML, Form-Data)</text>

        <rect x="0" y="14" width="870" height="155" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

        <g transform="translate(20, 38)" font-family="'Courier New', Courier, monospace" font-size="13">
          <text x="0" y="0" fill="#0f172a">{</text>
          <text x="20" y="22"><tspan fill="#0284c7" font-weight="bold">"nombre"</tspan>: <tspan fill="#b45309">"Teclado Mecánico Inalámbrico"</tspan>,</text>
          <text x="20" y="44"><tspan fill="#0284c7" font-weight="bold">"precio"</tspan>: <tspan fill="#059669" font-weight="bold">129.99</tspan>,</text>
          <text x="20" y="66"><tspan fill="#0284c7" font-weight="bold">"categoria"</tspan>: <tspan fill="#b45309">"Periféricos"</tspan>,</text>
          <text x="20" y="88"><tspan fill="#0284c7" font-weight="bold">"stock"</tspan>: <tspan fill="#059669" font-weight="bold">45</tspan>,</text>
          <text x="20" y="110"><tspan fill="#0284c7" font-weight="bold">"activo"</tspan>: <tspan fill="#7c3aed" font-weight="bold">true</tspan></text>
          <text x="0" y="132" fill="#0f172a">}</text>
        </g>

        <!-- Note about Body usage -->
        <g transform="translate(0, 180)">
          <rect width="870" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
          <text x="435" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#065f46" text-anchor="middle">
            📌 <tspan font-weight="bold">Presente habitualmente en:</tspan> POST (crear), PUT (reemplazar), PATCH (modificar)  •  <tspan font-weight="bold">Vacío habitualmente en:</tspan> GET y DELETE
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>