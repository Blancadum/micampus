<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="maven-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="lombok-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Fondo General -->
  <rect width="1200" height="580" fill="#f8fafc"/>

  <!-- Título y Subtítulo Superior -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="1080" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#badge-shadow)"/>
    <rect x="0" y="0" width="6" height="48" rx="3" fill="url(#header-grad)"/>
    <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0f172a">
      4. Herramientas del Entorno: Apache Maven y Project Lombok
    </text>
    <text x="730" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Automatización de Build &amp; Metaprogramación Limpia
    </text>
  </g>

  <!-- COLUMNA IZQUIERDA: APACHE MAVEN -->
  <g transform="translate(60, 115)">
    <!-- Tarjeta Principal Maven -->
    <rect width="525" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- Cabecera Maven -->
    <rect width="525" height="52" rx="12" fill="#f0f9ff"/>
    <rect y="40" width="525" height="12" fill="#f0f9ff"/>
    <line x1="0" y1="52" x2="525" y2="52" stroke="#bae6fd" stroke-width="1"/>

    <rect x="20" y="12" width="110" height="28" rx="6" fill="url(#maven-tag)"/>
    <text x="75" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      APACHE MAVEN
    </text>
    <text x="142" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369a1">
      Gestión de Dependencias y Ciclo de Vida
    </text>

    <!-- 1. Estructura Estándar de Carpetas -->
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      📁 Estructura Estándar ("Convención sobre Configuración")
    </text>

    <!-- Caja de Árbol de Directorios -->
    <rect x="24" y="92" width="477" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="40" y="115" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0369a1">mi-proyecto/</text>
    <text x="56" y="134" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" fill="#334155">├── pom.xml</text>
    <text x="165" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">→ Configuración GAV, dependencias y BOM</text>

    <text x="56" y="153" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" fill="#334155">├── src/main/java</text>
    <text x="195" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">→ Código fuente Java de producción</text>

    <text x="56" y="172" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" fill="#334155">├── src/main/resources</text>
    <text x="235" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">→ application.properties / YAML</text>

    <text x="56" y="191" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" fill="#334155">└── src/test/java</text>
    <text x="195" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">→ Tests unitarios y de integración (JUnit)</text>

    <!-- 2. Ciclo de Vida (Fases) -->
    <text x="24" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      ⚙️ Fases del Ciclo de Vida de Construcción (Build Lifecycle)
    </text>

    <!-- Diagrama de Fases Flujo Secuencial -->
    <g transform="translate(24, 245)">
      <!-- Fase 1: compile -->
      <rect x="0" y="0" width="85" height="38" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">compile</text>
      <text x="42" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">target/classes</text>

      <path d="M 89 19 L 98 19" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <polygon points="97,16 103,19 97,22" fill="#94a3b8"/>

      <!-- Fase 2: test -->
      <rect x="105" y="0" width="85" height="38" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="147" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">test</text>
      <text x="147" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">JUnit / Mockito</text>

      <polygon points="193,16 199,19 193,22" fill="#94a3b8"/>

      <!-- Fase 3: package -->
      <rect x="201" y="0" width="85" height="38" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="243" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">package</text>
      <text x="243" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">.jar / .war</text>

      <polygon points="289,16 295,19 289,22" fill="#94a3b8"/>

      <!-- Fase 4: install -->
      <rect x="297" y="0" width="85" height="38" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="339" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">install</text>
      <text x="339" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Repo Local ~/.m2</text>

      <polygon points="385,16 391,19 385,22" fill="#94a3b8"/>

      <!-- Fase 5: deploy -->
      <rect x="393" y="0" width="84" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="435" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">deploy</text>
      <text x="435" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Nexus/Artifactory</text>
    </g>

    <!-- 3. Spring Boot Starters y BOM -->
    <rect x="24" y="305" width="477" height="105" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="38" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369a1">
      📦 Starters de Spring Boot + BOM (Bill of Materials)
    </text>
    <text x="38" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155">
      • <tspan font-weight="600">spring-boot-starter-parent</tspan>: gestiona versiones compatibles sin declararlas.
    </text>
    <text x="38" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155">
      • <tspan font-weight="600">spring-boot-starter-web</tspan>: agrupa Spring MVC, Jackson y Tomcat embebido.
    </text>
    <text x="38" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155">
      • <tspan font-weight="600">spring-boot-starter-data-jpa</tspan>: incluye Hibernate, JPA API y Datasource.
    </text>
  </g>

  <!-- COLUMNA DERECHA: PROJECT LOMBOK -->
  <g transform="translate(615, 115)">
    <!-- Tarjeta Principal Lombok -->
    <rect width="525" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- Cabecera Lombok -->
    <rect width="525" height="52" rx="12" fill="#fef2f2"/>
    <rect y="40" width="525" height="12" fill="#fef2f2"/>
    <line x1="0" y1="52" x2="525" y2="52" stroke="#fecaca" stroke-width="1"/>

    <rect x="20" y="12" width="130" height="28" rx="6" fill="url(#lombok-tag)"/>
    <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      PROJECT LOMBOK
    </text>
    <text x="162" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">
      Eliminación de Código Boilerplate en Java
    </text>

    <!-- 1. Cuadrícula de Anotaciones Clave -->
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">
      🏷️ Anotaciones Fundamentales en Tiempo de Compilación
    </text>

    <!-- Mini-cards de Anotaciones -->
    <g transform="translate(24, 92)">
      <!-- @Getter / @Setter -->
      <rect x="0" y="0" width="232" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b91c1c">@Getter / @Setter</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Genera métodos accesores y mutadores</text>

      <!-- Constructores -->
      <rect x="244" y="0" width="233" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="256" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b91c1c">@No/AllArgsConstructor</text>
      <text x="256" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Constructor vacío y con todos los campos</text>

      <!-- @Data -->
      <rect x="0" y="58" width="232" height="52" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
      <text x="12" y="78" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#be123c">@Data (Bundle Completo)</text>
      <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#4c0519">Getter + Setter + ToString + Equals/Hash</text>

      <!-- @Builder -->
      <rect x="244" y="58" width="233" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="256" y="78" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b91c1c">@Builder</text>
      <text x="256" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Patrón Builder fluido para instanciación</text>

      <!-- @Slf4j -->
      <rect x="0" y="118" width="232" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="137" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b91c1c">@Slf4j</text>
      <text x="12" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Inyecta el logger listo: log.info(...)</text>

      <!-- @RequiredArgsConstructor -->
      <rect x="244" y="118" width="233" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="256" y="137" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b91c1c">@RequiredArgsConstructor</text>
      <text x="256" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Inyección de dependencias en Spring</text>
    </g>

    <!-- 2. Alerta Crítica JPA -->
    <g transform="translate(24, 275)">
      <rect width="477" height="135" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      
      <rect x="16" y="12" width="200" height="22" rx="4" fill="#d97706"/>
      <text x="116" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
        ⚠️ BUENA PRÁCTICA CRÍTICA
      </text>

      <text x="228" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#92400e">
        ¿Dónde usar @Data y dónde NO usarlo?
      </text>

      <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#78350f">
        • <tspan font-weight="700">DTOs y Mensajería:</tspan> Usa <tspan font-family="'JetBrains Mono', monospace" font-weight="700">@Data</tspan> libremente (o Java <tspan font-family="'JetBrains Mono', monospace">record</tspan>).
      </text>
      <text x="16" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#78350f">
        • <tspan font-weight="700">Entidades JPA (@Entity):</tspan> <tspan font-weight="700" fill="#b91c1c">¡EVITA @Data!</tspan>
      </text>
      <text x="32" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#92400e">
        Su @EqualsAndHashCode y @ToString causan recursión infinita
      </text>
      <text x="32" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#92400e">
        y <tspan font-style="italic">StackOverflowError</tspan> en relaciones bidireccionales (@OneToMany).
      </text>
      <text x="16" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#b45309">
        → Regla en JPA: @Getter + @Setter + @NoArgsConstructor (sin @EqualsAndHashCode global).
      </text>
    </g>
  </g>
</svg>
