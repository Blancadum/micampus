services:
  micampus:
    build:
      context: .
      dockerfile: Dockerfile
    image: micampus:latest
    container_name: micampus
    restart: unless-stopped
    ports:
      - "${MICAMPUS_PORT:-80}:8090"
    volumes:
      - ./micampus-data:/app/micampus-data
    environment:
      SERVER_PORT: "8090"
      MICAMPUS_AUTO_OPEN_BROWSER: "false"
      MICAMPUS_SESSION_SECRET: "${MICAMPUS_SESSION_SECRET:-cambia-esta-clave-larga-y-fija}"
      MICAMPUS_CORS_ORIGINS: "${MICAMPUS_CORS_ORIGINS:-http://localhost:8090}"
      MICAMPUS_COOKIE_SECURE: "${MICAMPUS_COOKIE_SECURE:-false}"
      MICAMPUS_COOKIE_SAME_SITE: "${MICAMPUS_COOKIE_SAME_SITE:-Lax}"
      MICAMPUS_SMTP_HOST: "${MICAMPUS_SMTP_HOST:-}"
      MICAMPUS_SMTP_PORT: "${MICAMPUS_SMTP_PORT:-587}"
      MICAMPUS_SMTP_USER: "${MICAMPUS_SMTP_USER:-}"
      MICAMPUS_SMTP_PASSWORD: "${MICAMPUS_SMTP_PASSWORD:-}"
      MICAMPUS_SMTP_FROM: "${MICAMPUS_SMTP_FROM:-}"
