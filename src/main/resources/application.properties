server.port=${PORT:8090}
spring.application.name=MiCampus
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Directorio portable junto al ejecutable (se puede sobreescribir con --micampus.data-dir=... o MICAMPUS_DATA_DIR)
micampus.data-dir=${MICAMPUS_DATA_DIR:./micampus-data}
micampus.public-dir=${MICAMPUS_PUBLIC_DIR:./frontend/public}
micampus.auto-open-browser=${MICAMPUS_AUTO_OPEN_BROWSER:true}
